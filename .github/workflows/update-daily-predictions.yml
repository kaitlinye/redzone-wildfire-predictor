name: Update daily predictions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redzone-daily-predictions
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-inference.txt

      - name: Install inference dependencies
        run: python -m pip install --requirement requirements-inference.txt

      - name: Download current and recent weather
        env:
          OPEN_METEO_BATCH_SIZE: "100"
          OPEN_METEO_WAIT_SECONDS: "12"
          OPEN_METEO_MAX_WORKERS: "8"
        run: python scripts/09_download_daily_forecast.py

      - name: Build next-day features
        run: >-
          python scripts/10_build_daily_features.py
          --weather data/current/weather/recent_weather.parquet

      - name: Generate website predictions
        run: python scripts/14_generate_website_predictions.py

      - name: Commit the generated browser data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/current/weather/recent_weather.parquet \
            docs/data/predictions.json
          if git diff --cached --quiet; then
            echo "Prediction JSON is unchanged."
          else
            git commit -m "Update daily wildfire risk predictions"
            git push origin HEAD:main
          fi
